# Built and tested with Arc Foundry (arc-forge), which executes under Arc's own EVM rules. Stock Foundry
# would run the same tests under Ethereum rules. The tests fork Arc testnet at a pinned block (see setUp), so the
# real USDC system contract and precompiles are used.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "osaka"
# MainnetScenario (test/) runs on a real chain, so `new X` must compile to plain CREATE.
dynamic_test_linking = false
network = "arc"
